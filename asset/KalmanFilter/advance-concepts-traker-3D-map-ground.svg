<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%" style="background-color: #ffffff; font-family: Arial, sans-serif;">
  
  <defs>
    <marker id="arrow-ned" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333" />
    </marker>
    <marker id="arrow-cam" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563EB" />
    </marker>
    <marker id="arrow-world" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-arc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <path d="M 50,550 L 950,550 L 850,680 L -50,680 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="780" y="660" font-size="18" fill="#64748b" font-weight="bold" font-style="italic">Earth Ground Plane (Z = 0)</text>

  <g transform="translate(150, 580)">
    <line x1="0" y1="0" x2="80" y2="-40" stroke="#333333" stroke-width="3" marker-end="url(#arrow-ned)" />
    <line x1="0" y1="0" x2="90" y2="20" stroke="#333333" stroke-width="3" marker-end="url(#arrow-ned)" />
    <line x1="0" y1="0" x2="0" y2="80" stroke="#333333" stroke-width="3" marker-end="url(#arrow-ned)" />
    <text x="85" y="-45" font-size="16" fill="#333333" font-weight="bold">North (X)</text>
    <text x="100" y="25" font-size="16" fill="#333333" font-weight="bold">East (Y)</text>
    <text x="-35" y="90" font-size="16" fill="#333333" font-weight="bold">Down (Z)</text>
    <text x="-60" y="-10" font-size="18" fill="#333333" font-weight="bold">Earth-Fixed</text>
    <text x="-60" y="10" font-size="18" fill="#333333" font-weight="bold">NED Frame</text>
  </g>

  <g transform="translate(300, 200)">
    <path d="M -80,0 C -80,-15 40,-20 80,0 C 40,20 -80,15 -80,0 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
    <path d="M -20,0 L -50,-60 L 10,-60 L 20,0 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <path d="M -20,0 L -50,60 L 10,60 L 20,0 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <path d="M -70,0 L -90,-30 L -80,-30 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <text x="-40" y="-80" font-size="18" fill="#333333" font-weight="bold">UAV / Vehicle Frame</text>
  </g>

  <circle cx="340" cy="210" r="15" fill="#f1f5f9" stroke="#334155" stroke-width="3" />
  <path d="M 340,225 L 340,240" stroke="#334155" stroke-width="4" />
  <circle cx="340" cy="245" r="12" fill="#94a3b8" stroke="#334155" stroke-width="2" />

  <path d="M 360,245 A 20 20 0 0 1 340,265" fill="none" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrow-arc)" />
  <text x="365" y="275" font-size="16" fill="#8B5CF6" font-style="italic" font-weight="bold">R<tspan dy="5" font-size="12">gimbal</tspan></text>
  
  <path d="M 320,200 A 25 25 0 0 1 360,200" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-arc)" />
  <text x="370" y="195" font-size="16" fill="#059669" font-style="italic" font-weight="bold">R<tspan dy="5" font-size="12">mount</tspan></text>

  <rect x="730" y="580" width="40" height="20" rx="4" fill="#475569" stroke="#1e293b" stroke-width="2" />
  <circle cx="740" cy="600" r="6" fill="#1e293b" />
  <circle cx="760" cy="600" r="6" fill="#1e293b" />
  <text x="790" y="595" font-size="18" fill="#333333" font-weight="bold">Target</text>

  <line x1="340" y1="245" x2="750" y2="590" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8,6" />
  
  <line x1="340" y1="245" x2="480" y2="280" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-cam)" />
  <text x="490" y="275" font-size="20" fill="#2563EB" font-style="italic" font-weight="bold">r̂<tspan dy="5" font-size="14">c</tspan></text>
  <text x="510" y="275" font-size="16" fill="#2563EB">(Normalized Camera Ray)</text>

  <line x1="340" y1="245" x2="520" y2="395" stroke="#DC2626" stroke-width="4" marker-end="url(#arrow-world)" />
  <text x="535" y="400" font-size="20" fill="#DC2626" font-style="italic" font-weight="bold">r⃗<tspan dy="5" font-size="14">w</tspan></text>
  <text x="560" y="400" font-size="16" fill="#DC2626">(Earth-Fixed World Ray)</text>

  <text x="600" y="490" font-size="22" fill="#333333" font-style="italic" font-weight="bold">d</text>
  <text x="620" y="490" font-size="16" fill="#333333">(Slant Range)</text>

  <path d="M 525,410 L 515,420 L 735,605 L 745,595" stroke="#64748b" stroke-width="1.5" fill="none" />
  
  <rect x="50" y="20" width="300" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="65" y="45" font-size="18" fill="#1e293b" font-weight="bold">Projection Mathematics:</text>
  <text x="65" y="70" font-size="16" fill="#DC2626" font-family="monospace" font-weight="bold">r⃗<tspan dy="5" font-size="12">w</tspan><tspan dy="-5"> = R</tspan><tspan dy="5" font-size="12">UAV</tspan><tspan dy="-5"> · R</tspan><tspan dy="5" font-size="12">mount</tspan><tspan dy="-5"> · R</tspan><tspan dy="5" font-size="12">gimbal</tspan><tspan dy="-5"> · </tspan><tspan fill="#2563EB">r̂<tspan dy="5" font-size="12">c</tspan></tspan></text>
  <text x="65" y="95" font-size="16" fill="#333333" font-family="monospace" font-weight="bold">P<tspan dy="5" font-size="12">target</tspan><tspan dy="-5"> = P</tspan><tspan dy="5" font-size="12">UAV</tspan><tspan dy="-5"> + d · r⃗</tspan><tspan dy="5" font-size="12">w</tspan></text>

</svg>
